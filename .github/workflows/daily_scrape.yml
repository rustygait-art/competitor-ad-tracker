name: Scheduled Competitor Ad Scraper

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger via Streamlit UI or GitHub Actions
    inputs:
      competitor_domain:
        description: 'Target domain to scrape'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Scraper & AI Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.competitor_domain }}" ]; then
            echo "Scraping target domain: ${{ github.event.inputs.competitor_domain }}"
            python scraper.py "${{ github.event.inputs.competitor_domain }}"
          else
            echo "Running scheduled update for existing tracked domains."
            python scraper.py
          fi

      - name: Save updated database to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add competitor_ads.db
          git commit -m "Auto-update competitor ad database [skip ci]" || exit 0
          git push
